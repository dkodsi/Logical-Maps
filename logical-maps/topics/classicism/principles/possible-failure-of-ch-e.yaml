id: possible-failure-of-ch-e
name: Possible failure of the Continuum Hypothesis (type e)
category: mathematical-contingency
statement: >-
  Possibly, some real number structure whose numbers are of the type of the numbers counted at type $e$ falsifies
  the continuum hypothesis.
formal: $\Diamond\exists\mathfrak R\, .\,\operatorname{Real}_{\nu_e}(\mathfrak R)\land\neg\operatorname{CH}(\mathfrak R)$
definitions: >-
  See Background, Analysis, for real number structures and $\operatorname{CH}(\mathfrak R)$: every collection
  of the structure's reals injects into its numbers or is in bijection with its reals, injections and bijections
  being relations. $\nu_e=(et)t$ is the type of the numbers counted at type $e$; a structure at $\nu_e$ has
  entities of that type for its numbers and properties of them for its reals. Any two real number structures in
  a world agree on the continuum hypothesis ([[real-structures-isomorphic]]), so "some" here is as much as
  "some, and every".
date: '2026-11-16'
sources:
- Andrew Bacon, finite-power forcing proof of cardinal CH contingency, checkpoint 151 version 349 (14 November
  2026), formalized by OpenAI Codex, prompted by Andrew Bacon.
- Zachary Goodsell, 26 November 2026, that the conclusion be stated for real number structures, which the
  premises make of the at-least numbers with their rigid properties (Background, the numbers with their rigid
  properties).
source_names:
- Bacon, finite-power CH
- Goodsell 26 Nov
notes: >-
  Bacon's forcing argument gives it from Mathematical Possibilism with □Rigid Comprehension, Intensional
  Choice and □Potential Infinity (type e), without Relational Choice
  ([[mathematical-possibilism-implies-possible-failure-of-ch-e]]). With the possibility of the continuum hypothesis it refutes
  Non-contingency of the Continuum Hypothesis ([[possible-ch-e-and-possible-failure-of-ch-e-incompatible-with-non-contingency-of-ch]]).
changes:
