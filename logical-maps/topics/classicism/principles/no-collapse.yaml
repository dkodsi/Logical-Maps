id: no-collapse
name: No Collapse
category: necessity-varieties
statement: There is a family of propositional operators containing the broadest necessity, closed under hatting, none of whose members is identical to its own hat.
formal: '$\exists\mathcal F^{(tt)t}\, .\,\mathcal F\Box\land\forall X^{tt}\, .\,(\mathcal FX\to\mathcal F\hat X)\land(\mathcal FX\to X\ne\hat X)$'
definitions: 'Here $\Box$ is the operation $\lambda p^t\, .\,p=\top$, and $\hat X:=\lambda p^t\, .\,\exists q^t\, .\,q\land\Box(\neg(X(\neg q))\to p)$. The family has type $(tt)t$. Inequality is literal inequality of whole operators; equivalently, necessary coextension fails, although current coextension may hold.'
date: '2026-10-30'
sources:
- Cian Dorr, No Collapse candidate and consistency conjecture, 14 October 2026, Logical Maps candidate register, No Collapse section, unpaginated.
- Cian Dorr, John Hawthorne, and Juhani Yli-Vakkuri, The Bounds of Possibility, Appendix D, pp. 400–409, for the hat operation and modal background.
source_names:
- Dorr 14 Oct
- Bounds of Possibility
references:
- paper: bounds-of-possibility
  role: background
  locator: Appendix D, pp. 400–409
  note: The hat operation and its iterates; the single-family No Collapse formulation is Dorr's later candidate.
about: 'A hat-closed family containing $\Box$ contains every finite iterate. No Collapse therefore makes each adjacent pair of iterates distinct, while also requiring that one admitted family contain them. The model [[finite-pin-fanout-nested-equivalence-components]] supplies such a family.'
notes: 'This is the current existential family sentence. Its clauses are not boxed. Distinct whole operators may be currently coextensive: the model satisfies current [[actuality]] and all positive iterates agree currently with truth. Extensional No Collapse is a different candidate.'
