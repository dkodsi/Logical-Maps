id: non-contingency-of-ch
name: Non-contingency of the Continuum Hypothesis
category: mathematical-contingency
statement: >-
  Either necessarily, if there is a real number structure then every real number structure satisfies the
  continuum hypothesis, or necessarily, if there is one then every one falsifies it. The continuum
  hypothesis of a structure says that every collection of its reals injects into its numbers or is in
  bijection with its reals. One sentence for each type $\sigma$.
formal: >-
  $\Box\bigl(\exists\mathfrak R\, .\,\operatorname{Real}_\sigma(\mathfrak R)\to\forall\mathfrak R\, .\,\operatorname{Real}_\sigma(\mathfrak R)\to\operatorname{CH}(\mathfrak R)\bigr)\;\lor$
  $\Box\bigl(\exists\mathfrak R\, .\,\operatorname{Real}_\sigma(\mathfrak R)\to\forall\mathfrak R\, .\,\operatorname{Real}_\sigma(\mathfrak R)\to\neg\operatorname{CH}(\mathfrak R)\bigr)$
definitions: >-
  See Background, Analysis, for real number structures, natural-number structures with their full
  powers, and for $\operatorname{CH}(\mathfrak R)$, with injections and bijections as relations. The
  antecedent of each disjunct, that there is a real number structure, is redundant, the disjunct being
  equivalent to its consequent boxed; it says what the disjunct is about. This is the instance of the Necessity of Second-Order Analysis at the continuum hypothesis,
  kept apart because the sources treat it on its own. Which way it fails, true but possibly false or
  false but possibly true, is a matter of models, not of the principle.
date: '2026-10-23'
sources:
- Andrew Bacon, Could the truths of mathematics have been different?, draft of 9 October 2025, §5,
  pp. 21–22 (Conjecture 5.1, Theorem 5.1), and §6, Theorem 6.1.
- Neil Barton and Zachary Goodsell, Continuum Contingency, draft of 14 October 2026, §5.6, eq. (27), §5.9,
  and Theorems 20–24.
source_names:
- Could mathematics have been different?
- Continuum Contingency
references:
- paper: bacon-mathematical-contingency
  role: origin
  locator: §5, pp. 21–22; §6, Theorem 6.1
  note: Bacon's structural contingency of the continuum hypothesis is the failure of this principle.
- paper: barton-goodsell-continuum-contingency
  role: formulation
  locator: §5.6, eq. (27); §5.9; §§8–9, Theorems 20–24
  note: Their formulation of CH for the reals as rigid properties of naturals; here it is read in any
    real number structure.
notes: >-
  Follows from the Necessity of Second-Order Analysis
  ([[necessity-of-second-order-analysis-implies-non-contingency-of-ch]]) and so, by Bacon's Theorem 5.2,
  from Atomicity with □Rigid Comprehension. Bacon's forcing argument
  refutes it, from Mathematical Possibilism with □Rigid Comprehension, Intensional Choice, □Potential
  Infinity (type e) and Relational Choice ([[mathematical-possibilism-and-relational-choice-incompatible-with-non-contingency-of-ch]]):
  it makes the continuum hypothesis possible, and its failure possible, in a real number structure whose
  numbers are the at-least numbers over individuals ([[mathematical-possibilism-and-relational-choice-imply-possible-ch-e]],
  [[mathematical-possibilism-implies-possible-failure-of-ch-e]]). That is his Theorem 6.1 with its premises revised.
  Of Barton and Goodsell's stitched models, the one adding a single Cohen real
  ([[stitched-cohen-extension]]) leaves the truth value of the continuum hypothesis unchanged and
  satisfies it; the instance of their Theorem 20 that adds $\aleph_2$ Cohen reals or collapses the
  continuum, by cases on CH ([[stitched-ch-reversing]]), refutes it, with □Rigid Comprehension and
  □Atomicity at type $t$. Bacon's Theorem 5.1 model of C5 with Rigid Comprehension also refutes it and is
  not recorded. It fails in [[full-boolean-valued-atom-and-atomless]], Bacon's Boolean-valued
  model of §B.2 with the algebra chosen by cases on CH, and it is incompatible with Maximalism
  ([[maximalism-incompatible-with-non-contingency-of-ch]]).
