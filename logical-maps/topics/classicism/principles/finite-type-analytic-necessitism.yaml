id: finite-type-analytic-necessitism
name: Finite-Type Analytic Necessitism
category: mathematical-contingency
statement: If a real number structure is possible at a type, there is a rigid, necessarily real structure
  at that same type. Its iterated rigid powers represent every admitted subset at each possibility, through
  any specified finite height. There is one sentence for each host type and finite height.
formal: $\Diamond\exists\mathfrak R\, .\,\operatorname{Real}_\tau(\mathfrak R)\;\to\; \exists\mathfrak
  R\, .\,\operatorname{RigidStr}(\mathfrak R)\land \Box\operatorname{Real}_\tau(\mathfrak R)\land \operatorname{RepPower}_1(\mathsf
  P^{n+1}(X),\mathsf P^n(X))\qquad(n\ge0)$
definitions: '$X^{\tau t}$ is the carrier of the returned real number structure. Use the definitions of
  $\operatorname{Real}_\tau$, $\operatorname{RigidStr}$ and represented powers from Background, Analysis:
  the carrier, order, field operations and numberhood are rigid, and carrier members are necessarily distinct.
  Put $\mathsf P^0(X)=X$ and $\mathsf P(Y)=\lambda A\, .\,\operatorname{Rigid}(A)\land A\le Y$; $\operatorname{RepPower}_1(\mathsf
  P(Y),Y)$ includes rigidity of the power and necessary representation of every admitted predicate on
  $Y$. Types and finite heights are metalinguistic schema indices. The real carrier stays at the same
  host $\tau$ on both sides; successive powers have their native higher predicate types.'
date: '2026-10-30'
sources:
- GPT-6 Astra, prompted by Daniel Kodsi, Finite-Type Necessitism and Analytic Non-Contingency, source
  dated 30 October 2026, §4, Definition 2 and Theorem 8, pp. 6–8.
source_names:
- Finite-Type Necessitism and Analytic Non-Contingency
references:
- paper: barton-goodsell-continuum-contingency
  role: background
  locator: §5.8–§5.9
  note: The existing analytic and second-order analytic principles extended by finite power iteration.
about: 'Second-Order Analytic Necessitism represents relations of every finite arity on a real carrier.
  This principle also asks for successive powers: families of subsets, families of those families, and
  so on to any specified finite depth. The highest power clause supplies the preceding clauses for that
  same fixed witness. No infinite tuple of witnesses or cumulative code is asserted.'
notes: Finite-Type Necessitism together with Analytic Necessitism suffices ([[finite-type-necessitism-and-analytic-necessitism-imply-finite-type-analytic-necessitism]]).
  It implies Second-Order Analytic Necessitism ([[finite-type-analytic-necessitism-implies-second-order-analytic-necessitism]])
  and its existing truth-non-contingency consequences. It may be vacuous where no real structure is possible;
  no implication back to guarded Finite-Type Necessitism without activation is asserted. The definition
  does not require higher powers to fit into the original real carrier's host type.
