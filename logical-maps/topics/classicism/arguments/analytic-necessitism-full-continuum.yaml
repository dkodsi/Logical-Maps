id: analytic-necessitism-full-continuum
requires: [full-continuum-everywhere]
choice: free
holds: [analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  Let $v$ be the evaluation object and $\tau$ and the $Y_A$ as in the condition: codomain-only intensions
  in the domain, continuum many and pairwise distinct at every reachable object, whose transport along an
  arrow into an object is the like intension there; and for any set $T$ of tuples of them the codomain-
  only intension with value $T$ at an object is in the domain. Carry the natural numbers and the sets of natural numbers onto the $Y_A$ at $v$ and take as numbers, successor,
  reals and membership the codomain-only intensions with the corresponding values at each object. Along every
  arrow the structure goes to an isomorphic one at the target, which is a real number structure there, every set
  of its numbers being the set of members of one of its reals. So the structure is rigid, with necessarily
  distinct numbers and reals, and necessarily a real number structure: the
  consequent of Analytic Necessitism holds, and so does the principle. (The withdrawn analytic-
  necessitism-exact-collapses-symmetric built such a structure for its antecedent.)
revisions:
- date: '2026-11-26'
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  note: >-
    Reworded for real number structures as numbers and reals with a membership relation (Background,
    Analysis), in place of complete ordered fields. The verdict is unchanged.
