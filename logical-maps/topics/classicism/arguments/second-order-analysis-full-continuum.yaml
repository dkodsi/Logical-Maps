id: second-order-analysis-full-continuum
requires: [full-continuum-everywhere]
choice: free
holds: [necessity-of-second-order-analysis]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
date: '2026-10-25'
text: >-
  Let $v$ be reachable from the evaluation point. If every type is finite at $v$ there is no real number
  structure there, a real number structure having the infinitely many distinct numbers $0$, its successor,
  and so on. Otherwise let $D$ be as in the condition. Carry the natural numbers and the sets of natural
  numbers into $D$ by an injection: the numbers, zero, successor, reals and membership are sets of tuples
  from $D$, so extensions at $v$ of entities there, which form a real number structure $\mathfrak R^*$ at
  $v$, its fullness and the leastness of its numbers being tested against properties whose extensions
  among its numbers are all the sets of them. Its second-order quantifiers, applied to tuples from $D$,
  range over all relations on $D$, so for each second-order analytical sentence $A$, $A(\mathfrak R^*)$
  holds at $v$ iff $A$ is true of the natural numbers with all their sets under full semantics. Any real
  number structure $\mathfrak R$ at $v$, of any type, is isomorphic to $\mathfrak R^*$ by relations in the
  domain there (Background, [[real-structures-isomorphic]], a theorem of C), and $A(\mathfrak
  R)\leftrightarrow A(\mathfrak R^*)$ is a theorem of C given such an isomorphism, relations on the one
  structure being carried to the other by comprehension. So at every reachable object every real number
  structure satisfies exactly the second-order analytical sentences true of the natural numbers with all
  their sets, and each instance $\Box\forall\mathfrak R\,.\,\operatorname{Real}_\sigma(\mathfrak R) \to
  A(\mathfrak R)$ or $\Box\forall\mathfrak R\,.\,\operatorname{Real}_\sigma(\mathfrak R)\to\neg
  A(\mathfrak R)$ of the Necessity of Second-Order Analysis holds, with the Necessity of Analysis and the
  Non-contingency of the Continuum Hypothesis. The choice of the injection needs no choice principle, $D$
  having the cardinality of the continuum.
revisions:
- date: '2026-11-26'
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  note: >-
    Reworded for real number structures as numbers and reals with a membership relation (Background,
    Analysis), in place of complete ordered fields. The verdict is unchanged.
