id: second-order-analysis-extensionally-full
requires: [extensionally-full]
choice: free
holds: [necessity-of-second-order-analysis]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  Let $v$ be any object reachable from the evaluation point and $\mathfrak R$ a real number structure at
  $v$ (Background, Analysis). Its clauses are tested against the properties present at $v$, and by
  extensional fullness every set of entities of its type there is the extension at the identity of one of
  them. So the extension of $N$, the least property containing $0$ and closed under $S$, is the closure of
  $0$ under successor, that set being the extension of a property, and the numbers with $0$ and $S$ are a
  copy of the natural numbers. Every set of numbers is the set of members of exactly one real, each such
  set being the extension of a property, so the reals with membership are a copy of the sets of natural
  numbers. The structure's sum and product are those of the natural numbers, the relations that define
  them being all the relations on the numbers. A second-order analytical sentence $A(\mathfrak R)$
  quantifies over the relations among entities of the structure's type at $v$, applied to the structure's
  numbers and reals, and their extensions at the identity are all the relations on these, again by
  extensional fullness. So $A(\mathfrak R)$ holds at $v$ exactly when $A$ holds of the natural numbers
  with all their sets under full semantics, which depends neither on $v$ nor on $\mathfrak R$. Hence
  $\Box\forall\mathfrak R\,.\,\operatorname{Real}_\sigma(\mathfrak R)\to A(\mathfrak R)$ holds when $A$ is
  true of them and $\Box\forall\mathfrak R\,.\,\operatorname{Real}_\sigma(\mathfrak R)\to\neg A(\mathfrak
  R)$ when it is false: every instance of the Necessity of Second-Order Analysis holds, and with it the
  Necessity of Analysis and the Non-contingency of the Continuum Hypothesis, as recorded. No choice is
  used.
revisions:
- date: '2026-11-26'
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  note: >-
    Reworded for real number structures as numbers and reals with a membership relation (Background,
    Analysis), in place of complete ordered fields. The verdict is unchanged. Huntington's theorem is no
    longer used: the structure is standard because its numbers are the closure of zero under successor
    and its reals correspond to all the sets of them.
