- Rigid-union refinement 29 Oct
proof: See the write-up. With the same guard Box I*_sigma, the first FTN instance makes the canonical
  power of N_sigma rigid and necessarily full. Its rigid union is necessarily coextensive with N_sigma
  and hence identical to it, so numberhood is rigid. The necessary Peano guard gives necessary distinctness
  of its members. These are exactly Arithmetic Necessitism's two conclusions; neither the guard nor the
  source type is changed.
notes: The first power suffices. No assertion of genuine arithmetic at an unactivated type is added.
