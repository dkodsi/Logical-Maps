proof: See the write-up. An activated ANA instance gives a fixed necessarily-real structure at the specified
  host tau. Its fixed Peano substructure activates Box I*_tau, so guarded FTN supplies the canonical finite
  towers at that source. Dedekind cuts give a fixed reference continuum with the required finite powers.
  The rigid necessary field isomorphism to the chosen ANA field transports those powers to the SAME original
  real carrier. Only finitely many FTN instances are used at each requested height; no sequence of witnesses
  or choice of representatives is assumed.
notes: The possible-real antecedent of ANA supplies the fixed reference needed to activate guarded FTN.
  No separate Infinity premise is needed. A converse toward FTN requires an activated possible-real premise.
