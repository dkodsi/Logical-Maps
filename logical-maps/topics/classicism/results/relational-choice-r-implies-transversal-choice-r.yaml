notes: 'Does Relational Choice alone give a transversal for every equivalence relation? Christopher Sun
  observed that the literature claims this without proof. The converse is recorded. The quotient argument
  chooses from each cell $\lambda z\, .\,(Rx)z$ and needs the cells of two members of one class to be
  the same property; in C that is necessary coextension, and the hypothesis gives actual coextension only.
  No definable substitute for the cell helps, since an operation definable from $R$ identifies $x$ with
  $x''$ only when they are necessarily indiscernible with respect to $R$. A Zermelo-style well-ordering
  argument breaks at the same point: coextensive but distinct stages receive different chosen elements.
  The expectation is that the implication fails. What would settle it: a proof that uses the chosen relation
  to break the symmetry between coextensive cells, or a model of C with Relational Choice that is not
  extensionally full at its evaluation point. Every recorded model of Relational Choice is extensionally
  full there, in that every set of tuples from the domains is the extension of a rigid element, and that
  fullness verifies Transversal Choice by the same metatheoretic choice, so none separates the two. Symmetric
  Henkin models in the Fraenkel–Mostowski style cannot separate them either; see the write-up.

  Update of 28 September 2026: Christopher Sun showed on 26 September that Transversal Choice is equivalent
  to Relational Choice together with Transversal (transversal-and-relational-choice-imply-transversal-choice),
  so this question is equivalent to whether Relational Choice implies Transversal. Anything that implies
  Transversal, such as Actuality, closes the gap.


  Research update of 23 October 2026: the exact question is unboxed all-type Relational Choice ⇒ unboxed
  all-type Transversal Choice, including the individual type e. Selector improvement, deterministic-history
  limits and upper bounds for compatible represented chains have been supplied, but compatibility between
  different history codes reaching coextensive terminal states remains unresolved. Neither necessary functionality
  nor local candidate selection supplies it. A separator must fail Actuality and BC_tt, since the sharp
  proved RC_(t,t)+BC_tt⇒Actuality theorem and the recorded Actuality/Transversal bridges yield TC. Finite-orbit
  and conditional bounded-support arguments are constraints, not C+RC countermodels: the required finite-fragment
  factors remain unconstructed. These are new misc research notes, with the Sun/Goodsell provenance above
  retained. See the dated section of the matching write-up and the four-question conjecture handoff.'
