proof: 'C reflects distinctness-preserving possibility of every universal finite Boolean combination of
  typed identities: a false identity pattern is protected by the conjunction of its disequalities and
  NI. The pure sentence saying there are no strong propositional worlds is such a universal identity sentence,
  since the boxed decision law is itself equality to Top. The recorded atomless Maximalist model makes
  that sentence consistent with Max(C), so pure Strong Possibility supplies its distinctness-preserving
  possibility and reflection supplies its truth. A Strong Actuality witness contradicts it. The same-stem
  writeup also proves that existential projection sends every strong relational world to a strong propositional
  world, with no BF.'
