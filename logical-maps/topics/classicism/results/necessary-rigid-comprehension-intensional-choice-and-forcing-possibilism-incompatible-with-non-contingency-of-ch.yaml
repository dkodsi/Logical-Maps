  note: □Rigid Comprehension, Intensional Choice and Mathematical Possibilism (the map's Forcing
    Possibilism) entail structural contingency about the continuum hypothesis, $\Diamond\exists X(\operatorname{Real}X\land\operatorname{CH}(X))\land\Diamond\exists X(\operatorname{Real}X\land\neg\operatorname{CH}(X))$,
    which contradicts both disjuncts of the Non-contingency of the Continuum Hypothesis at that type.
