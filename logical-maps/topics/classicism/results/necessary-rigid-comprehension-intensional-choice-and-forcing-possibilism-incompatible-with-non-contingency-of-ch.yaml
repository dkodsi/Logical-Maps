notes: >-
  Stated by Bacon as a theorem, with the proof deferred to another venue; his handout of 19 October 2026
  on the lottery-algebra model and the draft Modalized Domains on Possibility Frames do not reproduce it
  (the lottery record notes a transfer argument not given there). The expected proof: Forcing Possibilism
  supplies a proposition whose entailment algebra is a complete Boolean algebra forcing CH, and one
  forcing its negation; under □Rigid Comprehension and Intensional Choice the real number structures at
  the worlds below each are those of the corresponding generic extensions. Recorded as conjectured until
  a proof is supplied; a written proof, or a model of the three premises deciding CH one way necessarily,
  would settle it.
  Update, 23 October 2026: the current proved records already supply countermodels to this exact
  database formulation, including [[full-free-monoid-glued-constants-singleton]]. The shared arguments
  [[full-rigid-comprehension]], [[intensional-choice-well-ordering]],
  [[forcing-possibilism-countably-many-arrows]] and [[second-order-analysis-extensionally-full]]
  give all four premises, with metatheoretic Choice for the choice and cardinality steps. For a
  countable arrow set, there are continuum many propositions, so strict-smallness Forcing Possibilism
  requests only finite complete Boolean algebras. It does not supply an algebra forcing either side
  of CH. The attributed source statement is preserved: the source main text uses strict smallness,
  whereas Appendix A.3 uses a non-strict bound, and its background language also needs comparison.
  See the matching write-up. This is not a claim that Bacon's theorem under its intended formulation
  has been refuted. The record remains conjectured; its refutation under the current encoding is
  computed from the existing models, not stored as a new proof status.
