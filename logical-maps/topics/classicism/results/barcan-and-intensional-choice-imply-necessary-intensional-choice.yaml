proof: Totalizing each property F makes IC equivalent to existence of G with G≤F and □(F is inhabited
  → G is uniquely inhabited). Both witness tests are positive boxed formulas. Axiom 4 and necessitated
  existential introduction make the existential witness claim persistent. BF at the predicate type collects
  these claims over F, yielding necessary IC. The same-stem writeup proves the equivalence and the precise
  type bound.
