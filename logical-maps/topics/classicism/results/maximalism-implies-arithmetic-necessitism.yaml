proof: For each fixed carrier type sigma, the one-world full extensional model with one individual has
  finitely many entities at every admitted type and falsifies native I*_sigma. Thus the pure sentence
  not I*_sigma is consistent with C. Pure Maximalism gives Diamond not I*_sigma, so Box I*_sigma is false.
  The corresponding Arithmetic Necessitism implication is therefore true. See the same-stem writeup.
notes: This is the existing complete-component argument abstracted to its actual premise. Arithmetic Necessitism
  holds here vacuously; it does not assert stable arithmetic under Infinity, and it is not Necessity of
  Arithmetic. No necessary version is inferred. Independent AI mathematical review; no human or Lean certification.
