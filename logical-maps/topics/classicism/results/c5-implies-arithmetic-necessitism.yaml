proof: Numberhood is persistent by necessitating the C theorem obtained from induction with the predicate
  □N. In C5, persistence implies inextensibility, so N is rigid. C5 also gives ND at the number type;
  restricting to numbers gives the second conjunct. The exact □I* antecedent is retained and is unused.
  See the write-up for the definition and theoremhood checks.
notes: All admitted counting types, including e, are covered. No Rigid Comprehension, Actuality, choice
  or external standardness premise is used. The connecting argument is original misc, not attributed to
  the sources of the definitions.
