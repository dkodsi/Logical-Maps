proof: >-
  At the type $\nu_et$, Non-contingency of the Continuum Hypothesis says that necessarily every real number
  structure satisfies the continuum hypothesis, or necessarily every one falsifies it. The possibility of one
  that falsifies it denies the first, and the possibility of one that satisfies it denies the second.
