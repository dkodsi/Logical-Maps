proof: See the write-up. Under each necessary Peano guard, boxed Rigid Comprehension gives the fixed canonical
  number carrier and necessary fullness of its canonical rigid power. Current Rigid Power makes that power
  rigid. Iterate at each external finite height; necessary distinctness passes from a fixed carrier to
  its rigid subproperties. Only the fullness argument uses boxed RC; the optional RP premise is never
  necessitated.
notes: The necessary arithmetic guard, necessary inclusion and leading boxes in rigidity are retained.
  The Rigid Power premise is current, not boxed. Boxed Plenitude already gives both premises through existing
  results.
