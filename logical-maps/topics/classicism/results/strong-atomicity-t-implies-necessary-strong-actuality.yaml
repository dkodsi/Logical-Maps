proof: 'Let c be the Strong Actuality proposition. Every current strong world w entails c: its boxed decision
  law persists by 4, and wherever w is true it witnesses c there. If c is not Top, Strong Atomicity supplies
  a nonzero strong world below its complement, contradicting the previous bound. Thus c=Top, exactly necessary
  Strong Actuality. The same-stem writeup gives the full relational cover theorem and modal details.'
