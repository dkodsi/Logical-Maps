notes: 'The restriction of the signature schema to pure P gives ◇≠P for every pure P consistent with Max(C(Σ));
  the pure schema asks for every pure P consistent with Max(C). So the arrow holds iff Max(C(Σ)), equivalently
  Max(C) plus Separated Structure, is conservative over Max(C) for pure sentences: every pure sentence
  consistent with Pure Maximalist Classicism must remain consistent when Separated Structure is added.
  Adjoining constants is conservative for C, which is why Possibility Maximalism (signature Σ) implies
  Possibility Maximalism (pure), but for the maximalization a model of Max(C) + P would need its constants
  interpreted so that each realizes every consistent role at some truncation, which is not automatic.
  A proof of that conservativity, or a pure sentence consistent with Max(C) but not with Max(C) + Separated
  Structure, would settle it.


  Correction of 23 October 2026 to the historical iff guidance above: for each fixed admitted Σ containing
  a relational constant, the completed ordinary argument gives [SP(Σ) entails pure SP] iff [SP(Σ) is inconsistent].
  Let A₁ be Fregean ∧ ExactlyOneIndividual and U=Atom_t(A₁). The pure-profile model proves Con(Max(C)+U),
  whereas two signature-Max instances split A₁ and yield Max(C(Σ))⊢¬U. Universal-identity reflection gives
  C⊢◇_≠U→U; thus signature SP refutes a licensed pure-SP instance. In general the earlier consistency-preservation
  condition CP is sufficient, while the correct unconditional relation is implication iff (CP or inconsistency
  of SP(Σ)); the earlier iff needs Con(SP(Σ)). Here CP is explicitly false. This is completed ordinary
  mathematics, not a conjectured intermediate lemma. Final SignatureSplit verification certifies the signature
  splitting and its two concrete consistency models; it does not certify the separate pure-profile Max+U
  construction or the full incompatibility argument. Signature-SP consistency is not established, so this
  implication remains conjectured. Pure-SP consistency is separately exposed at [[strong-possibility-r-inconsistent]].
  See the matching write-up for precise scope and evidence; no infinitary language or consistency premise
  is silently added.'
