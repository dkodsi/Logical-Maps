proof: >-
  Let S be the type of six-place relations on individuals. The write-up defines
  a closed pure operator Q, the predicate ρ(x) saying that some F satisfies
  QF = x and rejects x, and d = Qρ. Classicism proves ρ(d), hence provides F with
  QF = d and Fd distinct from top. At a definable Maximalist root, each F has a
  term descriptor f. An auxiliary site for each old arrow and each target tuple
  tests the whole six-place relation d. It follows that provable Qf = d entails
  provable f(d) = top. Thus the descriptor root satisfies the sentence Ψ saying
  that Strong Actuality holds and that, whenever QF = d, every continuation
  failing Strong Actuality has Fd = top. A second ordinary Maximalist root has
  an atomless algebra of propositions. Its distinctness-preserving possibility
  excludes Strong Actuality. At a point satisfying both possibility instances,
  restore the true guard “Strong Actuality fails and Fd is distinct from top”
  through a Ψ-point. The identity QF = d persists, so Ψ forces Fd = top on
  restoration, a contradiction.
  In the term test every relational name retains its old value and each
  individual name has its own eight-element fibre at each auxiliary site.
  The descriptor and atomless roots are ordinary Maximalist models in the
  specified signature. Both sentences therefore have the required licences
  even with arbitrarily many names.
