notes: >-
  Conjectured: Strong Possibility (pure) is inconsistent. *Classicism* leaves its consistency open (§2.6). The
  gold tier is Zachary Goodsell's, 26 November 2026.


  Cian Dorr's attempt is the write-up of [[strong-possibility-signature-r-inconsistent]]. It refutes Strong
  Possibility (signature Σ) whenever $\Sigma$ has a constant with an argument of a type other than $e$. From
  such a constant it builds a closed term of type $t\to t$ that can be made true of any chosen set of root
  propositions in the models of [[coalesced-definable-root-signature]], and with it two sentences $E_1$,
  $E_2$, existential closures of identities and distinctnesses, that split a Russell–Myhill collision
  according to its witness. C($\Sigma$) proves $E_1\lor E_2$, Maximalism (signature Σ) is consistent with
  $\neg E_1$ and with $\neg E_2$, and C proves $E_i\to\Box_{\ne}E_i$; so Strong Possibility would give
  $\neg E_1$ and $\neg E_2$. The method does not reach the pure language. With no constant, no closed term
  has a root extension that can be chosen freely, and the write-up leaves this case open, together with the
  signatures all of whose constants are individual constants, propositional constants or predicates of
  individuals.


  What would settle it: a disjunction of closed pure sentences, each an existential closure of identities
  and distinctnesses, that Maximalism (pure) proves without proving a disjunct; or, against the conjecture,
  a model of Strong Possibility (pure). Neither is known. Such a model would have to refute the Infinity
  Schema (type e), BF (type t), Strong Actuality, Truths are ND-necessary, Two-hat necessities are
  ND-necessary and Maximalism (signature Σ), each of which is incompatible with Strong Possibility (pure)
  ([[strong-possibility-and-infinity-e-incompatible]], [[strong-possibility-incompatible-with-barcan-t]],
  [[strong-possibility-and-strong-actuality-incompatible]],
  [[strong-possibility-and-truths-are-nd-necessary-incompatible]],
  [[strong-possibility-and-two-hat-implies-nd-incompatible]],
  [[maximalism-signature-incompatible-with-strong-possibility-pure]]). The last of these makes the two
  forms of Strong Possibility jointly inconsistent; neither conjecture is known to give the other.
