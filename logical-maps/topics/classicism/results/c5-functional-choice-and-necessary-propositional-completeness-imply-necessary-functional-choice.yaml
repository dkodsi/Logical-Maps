proof: 'Current Functional Choice supplies admitted selectors of singleton arguments at which a nonzero
  relation has a nonzero value. Under C5 their laws are quantified identity formulas and therefore necessary.
  The discharged theorem C5 plus these selectors plus BC_t implies FC: decode a strict splitter, use BC_t
  to obtain a true atom, normalize each serial relation by that atom, and decode the selected endpoint
  singleton graph. Necessitating this discharged theorem and using the explicitly necessary BC_t yields
  necessary FC. See the same-stem writeup.'
references: []
notes: The finite-instance proof does not necessitate current FC or current BC_t. No new observer principle
  is assumed. Ordinary mathematical proof, not Lean certification.
