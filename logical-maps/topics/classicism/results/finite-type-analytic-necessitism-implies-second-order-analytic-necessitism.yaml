proof: See the write-up. For a fixed finite arity bound, choose a sufficiently high FTAN instance at the
  same host. Downward propagation makes all preceding canonical powers of its fixed real carrier rigid
  and necessarily full. Iterated singleton and Kuratowski codes put each required tuple space into a finite
  hierarchy level. Restriction to the fixed code carrier, followed by pullback along its rigid necessary
  coding bijection, supplies the represented polyadic power at the ORIGINAL argument type. This produces
  the finite collection of powers required by SOAN.
notes: SOAN begins at arity one; no nullary encoding is required. All finite heights and arities are external.
  SOAN also yields Analytic Necessitism, Necessity of Second-Order Analysis and Non-contingency of CH
  through existing results.
