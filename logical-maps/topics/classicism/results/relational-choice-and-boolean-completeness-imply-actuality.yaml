proof: BC_tt makes evaluation preserve represented joins and ensures that a true disjoint join has a true
  member. RC_(t,t) gives a progressive operation selecting a nonzero false part of any nonzero remainder
  under failure of Actuality. The bare-C fixed-point argument produces a disjoint refinement of the falsehoods
  with join top, contradicting disjoint-join reflection. The write-up proves the guarded fixed-point step
  and the sharp local reduction.
notes: The sharp certificate needs only unboxed RC_(t,t) and BC_tt. The map edge states the all-type consequence.
  Neither ND nor BF nor Plenitude nor future choice/completeness is assumed.
