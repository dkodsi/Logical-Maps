proof: Construct the literal closed pure selector F and its splitting sentence S using the canonical Jech–Shelah
  generator code. Boolean-valued soundness in the constructed atomless rigid complete algebra shows C
  does not prove S=bottom. Unboxed Atomicity_t proves S=bottom by applying atomhood to a nonzero part
  of S; no optional premise is necessitated. Pure Max(C) supplies S≠bottom, a contradiction. The write-up
  gives the full finite coding, adequacy, soundness and atomicity proofs.
notes: The exact checked declaration has no selector, coding, model-existence, rigidity or non-theoremhood
  premise. The Jech–Shelah construction retains its attribution; the connecting inconsistency proof is
  misc. Max is relative to bare C in the original finitary pure language.
