proof: >-
  Use the regular-open completion of the countable-condition collapse. Relational Choice supplies the sequence of
  countability codes and the successive dense refinements. See the proof in [[mathematical-possibilism-and-relational-choice-incompatible-with-non-contingency-of-ch]].


  That is the possibility of cardinal CH: possibly, every collection of rigid properties of at-least numbers
  injects into the at-least numbers or is in bijection with all the rigid properties of them.
  At such a world □Rigid Comprehension and □Potential Infinity (type e) make the at-least numbers over
  individuals, with their rigid properties, a real number structure at $\nu_e$ (Background,
  [[rigid-power-of-the-numbers]]), and the continuum hypothesis of that structure is the cardinal statement.
  So possibly a real number structure satisfies the continuum hypothesis.
