proof: >-
  Relational Choice and Boolean Completeness imply Actuality by
  [[relational-choice-and-boolean-completeness-imply-actuality]]. Boolean Completeness together with
  this Actuality witness gives Weak Rigid Comprehension by
  [[completeness-and-actuality-imply-weak-rigid-comprehension]]. Retaining Relational Choice,
  [[relational-choice-and-weak-rigid-comprehension-imply-transversal-choice]] then gives Transversal
  Choice. These are implications over the same fixed C framework, with all premises and conclusions
  unboxed. The matching write-up also preserves the independent direct proof: for each admitted
  type σ, including e, RC_(σt,σ) and represented well-ordered Boolean-chain joins at σt suffice for
  TC_σ. It retains the original functional-graph variant, the guarded-operation refinement, and the
  chain-completeness and CBC+CCC corollaries with their exact type scopes.
