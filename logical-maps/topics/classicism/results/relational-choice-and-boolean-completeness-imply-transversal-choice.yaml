notes: >-
  Settles the unchanged conjecture of 27 September 2026; the certificate date records that origin.
  RC abbreviates Relational Choice here, not Rigid Comprehension. The direct proof does not pass
  through Actuality or Weak Rigid Comprehension. Its lower-type premises and represented-chain
  refinements are retained in the write-up rather than being replaced by the all-type composition.
  No ND, BF, Plenitude, or extensional identification of coextensive properties is assumed. The three
  component records of the composition have separate verified Lean certificates; this result's own
  generated statement remains lean: stated, and those certificates do not certify every refinement.
  The question whether Relational Choice alone implies Transversal Choice remains separate.
