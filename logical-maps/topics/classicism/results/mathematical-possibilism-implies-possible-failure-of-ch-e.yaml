proof: >-
  Use the regular-open completion of finite Cohen conditions at the second Hartogs carrier. The forced family
  witnesses a subcollection of the rigid power which does not embed into the lower naturals and into which the
  rigid power does not embed. See the proof in [[mathematical-possibilism-and-relational-choice-incompatible-with-non-contingency-of-ch]].


  That is the possible failure of cardinal CH: possibly, some collection of rigid properties of at-least numbers
  neither injects into the at-least numbers nor is in bijection with all the rigid properties of them.
  At such a world □Rigid Comprehension and □Potential Infinity (type e) make the rigid properties of the at-least numbers
  over individuals the reals of a real number structure at $\nu_et$, each number being represented by the property of
  being it (Background, [[rigid-power-of-the-numbers]]), and the continuum hypothesis of that structure is the
  cardinal statement.
  So possibly a real number structure falsifies the continuum hypothesis.
