proof: >-
  Conjoin the positive and negative possibility conclusions for the same lower-natural carrier and its rigid power.
  The negative proof uses no Relational Choice.


  Under the premises the rigid power of that carrier is the reals of a real number structure at $\nu_et$ at the worlds
  in question ([[mathematical-possibilism-and-relational-choice-imply-possible-ch-e]], [[mathematical-possibilism-implies-possible-failure-of-ch-e]]). So possibly
  a real number structure at $\nu_et$ satisfies the continuum hypothesis and possibly one falsifies it, and
  neither disjunct of Non-contingency of the Continuum Hypothesis holds at that type ([[possible-ch-e-and-possible-failure-of-ch-e-incompatible-with-non-contingency-of-ch]]).
  This is Bacon's Theorem 6.1 of *Could the truths of mathematics have been different?* with its premises
  revised: Mathematical Possibilism in its power-closed form, and □Potential Infinity (type e) and Relational
  Choice added.
