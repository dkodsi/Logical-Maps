proof: >-
  Conjoin the positive and negative possibility conclusions for the same lower-natural carrier and its
  rigid power. The negative proof uses no Relational Choice.


  The negative conclusion. Use the regular-open completion of finite Cohen conditions at the second
  Hartogs carrier. The forced family witnesses a subcollection of the rigid power which does not embed
  into the lower naturals and into which the rigid power does not embed. The positive conclusion. Use the
  regular-open completion of the countable-condition collapse. Relational Choice supplies the sequence of
  countability codes and the successive dense refinements. See the write-up.


  Under the premises the rigid power of that carrier is the reals of a real number structure at $\nu_et$
  at the worlds in question, each number being represented by the property of being it (Background,
  [[rigid-power-of-the-numbers]]), and the continuum hypothesis of that structure is the cardinal
  statement. So possibly a real number structure at $\nu_et$ satisfies the continuum hypothesis, and
  possibly one falsifies it. The first denies the second disjunct of Non-contingency of the Continuum
  Hypothesis at that type and the second denies the first. This is Bacon's Theorem 6.1 of *Could the
  truths of mathematics have been different?* with its premises revised: Mathematical Possibilism in its
  power-closed form, and □Potential Infinity (type e) and Relational Choice added.
notes: >-
  The failure of the continuum hypothesis needs no Relational Choice: Mathematical Possibilism with □Rigid
  Comprehension, Intensional Choice and □Potential Infinity (type e) makes it possible in a real number
  structure. Its possibility, the positive conclusion, uses Relational Choice. Bacon recorded the two
  conclusions as separate results, for his cardinal continuum hypothesis; the map keeps the theorem, whose
  proof gives both.
