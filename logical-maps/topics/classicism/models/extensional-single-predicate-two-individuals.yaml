definition: Fix exactly Sigma={c:et}. Use the full one-world extensional hierarchy with individuals {0,1},
  propositions {0,1} and every actual function at each admitted relational-output arrow type. Interpret
  c as the proper singleton {0}. The label 0 is external model notation, not a second language constant.
  Evaluate at its only world. The linked writeup §1 verifies the fixed typed C semantics.
