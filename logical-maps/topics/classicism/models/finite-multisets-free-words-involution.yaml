definition: >-
  Start with finite-multisets-free-words and take the direct product of its
  arrow monoid with the two-element group. Thus an arrow is a finite multiset,
  a word, and a bit. The individual domain is a singleton. At each relational
  type require a pin of at most $\kappa=\max(\aleph_0,|\Sigma|)$ multiset
  coordinates when comparing rows of the same size, word, and bit. There
  are $\kappa^+$ multiset coordinates. Transport is precomposition. Glue
  the signature's assignments along one-letter arrows with zero multiset and
  bit zero.
arguments:
- id: strong-atoms
  holds: [necessary-strong-atomicity-r, necessary-strong-actuality]
  choice: free
  writeup: finite-multisets-free-words-involution
  text: >-
    Specifying the multiset size and its finite support with multiplicities,
    together with the word and bit, singles out each arrow. Each nonzero
    relation has a single-arrow, single-tuple atom below it. By right
    cancellation, all its transports are singletons or bottom, so the atom
    is strong. The identity singleton is a true strong atom.
- id: barcan
  holds: [necessary-barcan-r]
  choice: free
  writeup: finite-multisets-free-words-involution
  text: >-
    The multiset-and-word lift extends along any arrow by undoing its bit in
    each prescribed row. The pin is the target pin together with the finite
    support of the arrow's multiset. Every typed entity lifts, giving Barcan.
- id: logical-necessity
  holds: [logical-necessity-r]
  choice: uses
  writeup: finite-multisets-free-words-involution
  text: >-
    Glue one realizing assignment for each realizable sentence on words
    ending in its chosen letter, retaining the bit coordinate. The zero-bit,
    zero-multiset arrow with this letter realizes the assignment; the union
    of the constituent pins has size at most $\kappa$. There is just one
    object and one individual.
- id: countable-joins
  holds: [necessary-countable-boolean-completeness-r]
  choice: uses
  writeup: finite-multisets-free-words-involution
  text: >-
    Every current set of standard numeral values is an admitted inductive
    row, so each internally countable family is externally at most countable.
    The rowwise union of its members has a pin of size at most $\kappa$
    obtained by taking the union of their pins.
- id: missing-join
  fails: [boolean-completeness-t, necessary-boolean-completeness-t]
  choice: free
  writeup: finite-multisets-free-words-involution
  text: >-
    In the size-one, empty-word, zero-bit slice use the family of singleton
    atoms indexed by one half of a partition into two sets of size $\kappa^+$.
    A least upper bound would include the first half and exclude the second,
    although its pin misses an index in each half.
- id: true-proposition-fails-five
  fails: [truth-implies-five-necessity, necessary-truth-implies-five-necessity]
  choice: free
  writeup: finite-multisets-free-words-involution
  text: >-
    Let $s$ be the unit with bit one. An admitted constant-row operator $X$
    tests a proposition at both the identity and $s$, so at any arrow $h$
    its test reads $p(h)$ and $p(sh)$. This two-point test satisfies N, K
    and B necessarily; B uses $s^2=1$. The proposition supported exactly
    at the identity is true but fails the test. It is not 5-necessary.
