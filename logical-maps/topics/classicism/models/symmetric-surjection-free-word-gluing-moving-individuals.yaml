id: symmetric-surjection-free-word-gluing-moving-individuals
name: 'Symmetric surjection and free-word model: moving individuals'
certificate:
  source_id: misc
  produced_by: OpenAI Codex, prompted by Daniel Kodsi, Logical Necessity constructions of 22 October 2026
  recorded_by: OpenAI Codex, prompted by Daniel Kodsi, independent integration review of 28 October 2026
