id: finite-pin-fanout-nested-equivalence-components
name: 'Finite-pin fanout: nested-equivalence components'
definition: 'For each positive integer d, form countable leaf structures A_d and B_d with d nested equivalence relations. Level-zero nodes have positive finite or countably infinite size. A level-j node U_j(m) has m infinite-parameter children and countably many children of every finite type. A_d has countably many top nodes of each finite parameter; B_d also has countably many infinite-parameter top nodes. Arrows within each two-object component are all total functions preserving the nested equivalences. Take disjoint tagged components, add a countably infinite root R with only its identity endomorphism and no incoming old arrows, and include every individual function R to each old object. At every relational type use all profiles pinned by finite subsets of the source individuals. Evaluate at R. The write-up specifies the full hierarchy, the uniform return calculation, and the admitted operator-family witness.'
