  text: 'Uniform finite-capacity allocation gives, for every positive d, a component separating O_(2d+1) from O_(2d+2). An adjacent root identity would propagate to every later pair and transport to a contradicted component. The family whose row at each arrow to V consists of all whole O_n at V is empty-pinned and has admitted old sections. It contains Box, is hat-closed, and has no current fixed member.'
