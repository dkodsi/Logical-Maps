id: supported-boolean-cofinite-current-distinctness
name: 'Supported Boolean model: cofinite interior with current distinctness'
certificate:
  source_id: misc
  produced_by: OpenAI Codex, prompted by Daniel Kodsi, supported Boolean constructions of 25 October 2026
  recorded_by: OpenAI Codex, prompted by Daniel Kodsi, independent integration review of 28 October 2026
  checked_by: []
  date: '2026-10-28'
  lean: none
sources:
- OpenAI Codex, prompted by Daniel Kodsi, Observer separation with propositional completeness and divergent
  possibilities, 25 October 2026, §§1–3 and 5a, unpaginated; independently expanded typed proofs in the
  linked writeup, §§1–3.
definition: Let A be the complete homogeneous atomless regular-open algebra of Cantor space and B=2×A×P(N),
  with Aut(A) acting on the middle factor. Set jprime(epsilon,a,S) to (1[value=Top],1_A,S) when a=1_A
  and S is cofinite, and to Bottom otherwise (retaining the displayed Top case); equivalently its opens
  are Bottom, Top and (0,1_A,S) for cofinite S. Individuals are a singleton. Admit all finitely A-supported
  nonexpansive functions for the equality delta_t(p,q)=jprime(p iff q) and recursively its open-meet function
  equalities. Quantifiers are actual B-meets/joins. Evaluate at a fixed ultrafilter of the middle A coordinate.
  The linked writeup §3 specifies the exact formula and verifies all typed soundness obligations.
arguments:
- id: current-full-distinctness
  text: Every typed equality is an open value. If false at a middle ultrafilter it is raw Bottom, so its
    distinctness and native necessity are Top. This proves the whole current ND schema; §3.
  by: OpenAI Codex, prompted by Daniel Kodsi, independent integration review
  date: '2026-10-28'
  writeup: supported-boolean-structural-contrasts
  holds:
  - distinctness-necessary-r
- id: current-propositional-atomlessness
  text: The local equality quotient is A×(P(N)/Fin), both factors atomless. Thus every nonzero proposition
    splits; §3.
  by: OpenAI Codex, prompted by Daniel Kodsi, independent integration review
  date: '2026-10-28'
  writeup: supported-boolean-structural-contrasts
  holds:
  - atomlessness
- id: admitted-partition-completeness-failure
  text: The empty-supported nonexpansive predicate (3) admits the family of infinite block classes, with
    arbitrary middle coordinate. Any upper bound has middle value 1 and a tail class that can be strictly
    reduced by one point per block. Complementing the admitted family gives native GLB failure; §3.
  by: OpenAI Codex, prompted by Daniel Kodsi, independent integration review
  date: '2026-10-28'
  writeup: supported-boolean-structural-contrasts
  fails:
  - boolean-completeness-t
- id: necessary-distinctness-failure
  text: ND_t is true at every middle ultrafilter but false at the first coordinate and every principal
    tail coordinate, by the explicit Top versus (1,1,N minus {n}) pair. Its value is (0,1,empty), whose
    jprime is Bottom. The native ND_t+BF_t implication then also refutes current BF_t; §3.
  by: OpenAI Codex, prompted by Daniel Kodsi, independent integration review
  date: '2026-10-28'
  writeup: supported-boolean-structural-contrasts
  fails:
  - necessary-distinctness-necessary-t
notes: The metatheory is ZFC. All current/necessary claims refer to the displayed evaluation, with no
  all-type BC flag inferred from propositional BC. Only the predecessor has the observer verdict proved
  in §2; no observer node is substituted. No original human source, native record, signature flag or Lean
  certificate is changed.
