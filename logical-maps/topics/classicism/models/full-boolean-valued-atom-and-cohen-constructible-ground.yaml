id: full-boolean-valued-atom-and-cohen-constructible-ground
name: 'Full Boolean-valued model: isolated atom and Cohen algebra over a constructible ground'
definition: Work internally over ZFC + V=L. Set E=omega, A=RO(Add(omega,1)), B=2 x A, D_e=E, D_t=B, and
  D_(sigma,rho)=D_rho^D_sigma for every admitted relational output rho. Use Boolean operations and complete
  meets/joins, ordinary application and abstraction, and crisp identity of ground entities at every type.
  Evaluate at the isolated first-coordinate atom. Interpret relational signature constants as top; no
  signature-specific verdict is claimed. This is a ground-specific variant of Bacon's full Boolean-valued
  construction, not a replacement of the CH-changing upstream model.
