id: interpretation-cover-named-permutations
name: 'Interpretation cover: named permutations'
definition: >-
  In ZFC take a nonempty set-sized family of pointed C action models witnessing every C-consistent
  pure sentence, using the interpretation-root construction's action-model-existence input. Keep
  all old objects, domains and arrows unchanged. Choose infinite typed auxiliary name sets large
  enough to dominate their domains and to give distinct coordinates to a fixed set-sized constant
  signature Sigma. Add a root whose individuals are its individual names, whose loops are all
  type-preserving permutations of names, and whose arrows into each old object are all typed
  interpretations of names in that object's domains. There are no old-to-root arrows and the
  designated root symmetry group is trivial. Root relational entities are exactly all profiles
  pinned by finitely many typed names and landing as whole admitted entities at every old target;
  pinning applies to all root loops including identity. Transport is precomposition. Individual
  constants denote their designated names; relational constants denote their named lifts, with
  empty root-loop rows and whole interpreted old sections. Evaluate at the root identity.
