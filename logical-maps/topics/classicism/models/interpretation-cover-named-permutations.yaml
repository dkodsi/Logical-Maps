arguments:
- id: current-barcan-and-choice
  holds: [barcan-r, relational-choice-r]
  by: OpenAI Codex, prompted by Daniel Kodsi, 26 October 2026, after Cian Dorr's interpretation-root machinery
  date: '2026-10-26'
  choice: uses
  writeup: interpretation-cover-named-permutations
  text: >-
    Root permutations are onto at every type. Every old interpretation can be matched on a finite
    pin by an onto interpretation, using finite modification of an infinite-fibre baseline; named
    lifts make the latter onto actual higher types. This proves current BF. Every external current
    relation is represented by a constant root-loop table with empty old rows, so external ZFC
    choice gives each current Relational Choice graph. These are not boxed verdicts.
- id: splitting-and-vicinity
  holds: [atomlessness, vicinity]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  choice: free
  writeup: interpretation-cover-named-permutations
  text: >-
    The root-loop characteristic proposition is a true Vicinity witness, since every loop has
    an inverse returning to the identity. A possible proposition splits either by varying a fresh
    individual-name image at a root loop, or by varying a fresh propositional-name interpretation
    between top and bottom in an old target. Both support locations are checked.
- id: named-signature-possibility
  holds: [possibility-plus-signature-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-named-permutations
  text: >-
    Replace the finitely many constants of a consistent Sigma formula by typed variables and
    existentially close. A pure-complete old component supplies values. Assign its values to
    the designated constant names and the displayed pairwise-distinct root individuals. The
    exact native exclusions from individual constants occurring in the formula make these
    prescriptions compatible. Whole named-lift landing supplies the formula's possible truth.
notes: >-
  This is the named expansion of the unrestricted permutation cover, not the colour-symmetric
  Boolean-complete cover. A larger signature may require a larger size instance. Signature
  constants have no additional nonlogical axioms and need not be fixed by loops. Pure Max,
  signature Max and the weaker possibility consequences are derived. No Strong Possibility, Boolean Completeness or observer verdict
  is asserted. The semantic existence input is inherited, not a new exact consistency-strength
  theorem.
