id: paired-stages-with-zero-arrows
name: Paired stages with zero arrows
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  checked_by:
  - Two further OpenAI Codex (GPT-6) agents independently reviewed the two modal separations, gluing and Boolean intervals.
  date: '2026-11-26'
  lean: none
sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, isolated zero coefficients over paired integer stages, 26 November 2026.
- Cian Dorr and Claude Fable 5.1 (Anthropic), paired-individuals-two-object, 14 October 2026.
source_names:
- Kodsi and Codex, 26 Nov
- Dorr and Fable, 14 Oct
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §§2.5, 3.5 and Appendix D
definition: >-
  The individual domain is a singleton. External block coordinates and ordinary coefficients
  are those of integer-stages-paired-individuals-glued-constants. Add a two-sided zero
  coefficient between every pair of objects. Decorate all coefficients with free words.
  Each relation gives arbitrary rows on zero arrows and uses one countable pin on
  ordinary arrows. Transport precomposes. Interpret the signature by gluing witnesses
  on private last-letter cylinders. Evaluate at the identity at stage 0.
arguments:
- id: homogeneous-stages
  holds: [logical-necessity-r]
  choice: uses
  writeup: paired-stages-with-zero-arrows
  text: >-
    Relabel stages and external coordinates simultaneously to preserve the pure model.
    Each realizable pure matrix and type list contributes one chosen witness tuple.
    On its matching named instances use a private last letter to glue those witnesses
    on both ordinary and zero rows. Each constant uses only countably many witness pins.
- id: finite-intervals
  holds: [forcing-possibilism]
  choice: uses
  writeup: paired-stages-with-zero-arrows
  text: >-
    With one individual the three closed ordinal thresholds bound the benchmark.
    Full current rows give an infinite carrier a countable power-closed subset above it.
    Every remaining small Boolean algebra is finite and is represented below a finite
    union of the isolated zero-arrow addresses.
- id: strict-modal-implications
  fails: [five-implies-two-hat-necessity, two-hat-implies-nd-necessity]
  choice: free
  writeup: paired-stages-with-zero-arrows
  text: >-
    Give both stage propositions and the pin-omission tester full rows on the zero
    arrows. An ordinary empty-word guard can only be recovered by ordinary composition.
    The doublet inclusion and returns of the integer-stage proof then refute the
    respective converses. The 5-Barcan theorem applies to the universal pin-omission
    tester as an equality of whole proposition entities.
- id: barcan-failure
  fails: [barcan-t]
  choice: free
  writeup: paired-stages-with-zero-arrows
  text: >-
    At a single isolated zero exit accept exactly its image of the root propositions,
    and accept all propositions elsewhere. Transport across this exit forgets the
    continuation coefficient, while a target proposition can distinguish two ordinary
    maps with a common word and target.
- id: orders-and-joins
  holds: [necessary-countable-boolean-completeness-r, modal-well-ordering-r]
  fails: [boolean-completeness-t, atomicity-t, actuality]
  choice: uses
  writeup: paired-stages-with-zero-arrows
  text: >-
    Current fullness makes internally countable families externally countable, and
    pointwise unions use countable unions of pins. Target-only orders witness Modal
    Well-Ordering. The ordinary sector retains the uncountable cylinder family without
    a join and the fresh-pair splitting of each of its nonzero propositions. Every
    true proposition has a nonzero ordinary part at the identity.
- id: represented-powers-and-analysis
  holds: [second-order-analytic-necessitism, necessity-of-second-order-analysis]
  choice: uses
  writeup: paired-stages-with-zero-arrows
  text: >-
    Every relational type has continuum many rigid labels testing the target stage,
    with all relations on these labels and all their powers represented by target-only
    rows at every stage. One individual cannot support a real number structure.
    Full current rows also make every actual real number structure standard and
    supply every unrestricted second-order relation on its numbers and reals.
- id: no-weakly-inextensible-coextension
  fails: [weakly-inextensible-comprehension-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: weak-inextensibility-at-the-paired-stages
  text: >-
    Give one proposition per ordinary pair a different nonempty-word
    profile and make its empty-word test ask whether the coefficient
    fixes the selected seat of that pair. A predicate representing
    this whole current family repeats its row at an endomorphism
    collapsing a pair off its pin. The tester deleting that pair's
    proposition on empty-word endomorphisms moving its seat still
    necessarily accepts every old family member, by the distinct word
    profiles and the selected seat's truth bit. It misses the repeated
    member, so no such predicate is weakly inextensible.
- id: tame-rigidity-by-countable-factorization
  holds: [necessary-tame-rigidity-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: tame-rigidity-at-the-paired-stages
  text: >-
    A weakly rigid relation has the union of the images of its current
    members over arrows agreeing on any enlarged countable pin. Enlarge
    the source pin to include the source copies of intermediate ordinary
    pairs meeting the next tester's pin or the image of the enlarged
    source pin. Pairs required to stay fixed can now stay fixed through
    both factors. Fresh intermediate pairs implement the prescribed
    values on the remaining member support. Thus any tester necessarily
    covering an intermediate row also covers every later row. Zeros,
    when present, have exact current images by their isolated addresses.
- id: both-powers-by-split-block-maps
  holds: [necessary-rigid-power-r, necessary-weakly-rigid-power-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: rigid-powers-at-the-unrestricted-paired-stages
  text: >-
    Match an ordinary arrow on a common pin of the bound and tester by
    a map split on every target block. Pull a future rigid subrelation
    back through this map and saturate its preimage over an enlarged
    source pin. The resulting rigid subrelation has the required whole
    image. Zero arrows, when present, already give exact images, and
    absorb the endomorphisms used in the saturation. Necessary Tame
    Rigidity identifies the two power properties at every stage.
