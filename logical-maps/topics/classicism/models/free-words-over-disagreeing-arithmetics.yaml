  lean: none
sources:
- Cian Dorr, two disagreeing extensional arithmetics, 19 October 2026, with Claude Opus 5.5 (Anthropic), who verified the original coalescence.
- The map's full-free-monoid-glued-constants construction for signature gluing on words.
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 26 November 2026, replicated terminal entrances and the combined model.
source_names:
- Dorr 19 Oct
- Free-monoid signature gluing
- Codex via Kodsi, 26 Nov
references:
- paper: bacon-dorr-classicism
  role: background
  locator: Appendix E, Definition E.2, pp. 80–83
definition: >-
  The root has a free monoid of words acting by surjections on its infinite
  individual domain. At every word there is an independent entrance to each of
  two extensional Henkin terminals, respectively the full hierarchy on the
  standard natural numbers and the internally full hierarchy on the naturals of
  a countable model of Zermelo set theory with Choice and its own inconsistency.
  A root relation has an unrestricted current tuple row at each word and one
  whole terminal coordinate at each entrance. Evaluate at the root with the
  given signature glued on disjoint final-letter sectors.
arguments:
- id: possible-witnesses
  holds: [possibly-witnessed-possibility-r]
  choice: uses
  writeup: free-words-over-disagreeing-arithmetics
  text: >-
    Pick one tuple per realized pure matrix and list of matching names at each
    object. Use a fresh letter whose individual surjection attains the assigned
    individuals, through the entrance projection for a terminal requirement.
    Copy a root tuple's relational values, including both terminal coordinates,
    onto its entire last-letter sector. Terminal-only witnesses use dedicated
    independent coordinates. This realizes every possibly witnessed matrix.
- id: arithmetic
  holds: [necessary-axiom-of-infinity-e]
  fails: [necessity-of-arithmetic]
  choice: uses
  writeup: free-words-over-disagreeing-arithmetics
  text: >-
    Both terminals have Peano Frege arithmetic on their respective naturals,
    and they disagree on the arithmetical consistency sentence for Zermelo set
    theory with Choice. The full present numeral cut at the root and the internal
    arithmetic of each infinite terminal exclude any finite cardinality of the
    universal individual property.
- id: barcan-and-boolean-structure
  holds: [necessary-barcan-r, necessary-strong-atomicity-r, necessary-boolean-completeness-t]
  choice: free
  writeup: free-words-over-disagreeing-arithmetics
  text: >-
    Word shifts have lifts at every relational type by copying whole profiles
    on a suffix, and each terminal coordinate is free. The root proposition
    algebra is a full powerset, and the terminal proposition algebras have two
    values. Single tuple relations at one root word or terminal entrance are
    available below every occupied relation and transport to strong atoms or
    bottom.
- id: modal-well-order
  holds: [modal-well-ordering-r]
  choice: uses
  writeup: free-words-over-disagreeing-arithmetics
  text: >-
    Put external root orders at every word and the corresponding internally
    available well-orders at all terminal entrances.
