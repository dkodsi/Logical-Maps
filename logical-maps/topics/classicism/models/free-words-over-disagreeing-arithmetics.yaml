id: free-words-over-disagreeing-arithmetics
name: Free words over two disagreeing arithmetics
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 26 November 2026
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 26 November 2026
