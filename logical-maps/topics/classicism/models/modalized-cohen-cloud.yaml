  writeup: rooted-cloud-relational-choice
  text: At the isolated root, Lemma 6.7 represents every relation on the quotient of existing entities
    by whole root identity. External ZFC Choice selects one output class for each input class of a serial
    relation. Give selected tuples the root-only proposition and all others bottom; this respects root
    identity, and at every cloud point both values are locally bottom. The admitted graph is total, single-valued
    and contained in the original relation. Individual outputs remain relationally encoded.
