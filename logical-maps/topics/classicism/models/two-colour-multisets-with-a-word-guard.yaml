id: two-colour-multisets-with-a-word-guard
name: Two-colour multisets with a word guard
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  checked_by:
  - Two other OpenAI Codex (GPT-6) agents, prompted by Daniel Kodsi, checked the coefficient comparisons, propositional Barcan witness and ordinal bound, 27 November 2026.
  date: '2026-11-27'
  lean: none
sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, two-colour variant of the finite-multiset word model, 27 November 2026.
source_names:
- Kodsi and Codex, 27 Nov
references:
- paper: bacon-dorr-classicism
  role: background
  locator: Appendix D, action models.
definition: >-
  The single object has one individual. Arrows are finite multisets of labels in two
  uncountable colour classes, paired with words. The rows of a relation depend on the
  word, total multiset size, and multiplicities on a countable set of labels. When
  the word omits a distinguished letter, the row may also depend on total multiplicity
  in the first colour class. Use fresh letters to interpret the signature.
arguments:
- id: named-witnesses
  holds: [logical-necessity-r]
  choice: uses
  writeup: two-colour-multisets-with-a-word-guard
  text: >-
    Gluing each true matrix's witness profiles along a fresh final letter preserves
    the extra colour observation, since none of these letters is the distinguished
    one. There is just one possible value for any individual name.
- id: single-arrow-atoms
  holds: [necessary-strong-atomicity-r, necessary-strong-actuality, necessary-truths-are-nd-necessary]
  choice: free
  writeup: two-colour-multisets-with-a-word-guard
  text: >-
    Pinning the finitely many labels of an arrow, with its word and total size,
    isolates that arrow. Each single-arrow single-tuple atom stays a singleton or
    bottom by cancellation; the identity-only truth is impossible after all proper arrows.
- id: lost-colour
  fails: [barcan-t]
  choice: free
  writeup: two-colour-multisets-with-a-word-guard
  text: >-
    After the distinguished letter, no prior proposition can distinguish the two
    colours at all degree-one singleton multisets. A tester at that arrow omitting
    the proposition which makes this distinction necessarily accepts every prior proposition.
- id: countability
  holds: [necessary-countable-boolean-completeness-r, necessary-axiom-of-infinity-t]
  fails: [boolean-completeness-t]
  choice: uses
  writeup: two-colour-multisets-with-a-word-guard
  text: >-
    Admitted current rows include the standard numeral cut and the propositional domain
    is infinite. Countable unions preserve countable support. An uncountable subfamily
    of singleton atoms over the distinguished word has no join when its omitted labels
    are likewise uncountable.
- id: finite-ordinal-benchmark
  holds: [forcing-possibilism]
  choice: uses
  writeup: two-colour-multisets-with-a-word-guard
  text: >-
    With one individual, a relation on orders and fields having the same extensional
    truth table at all arrows is drawn from a fixed finite set. The ordinal constructors
    preserve that set, using the finite haecceity union for a rigid family of its members.
    Only finite Boolean algebras are revised-small, and every finite Boolean algebra
    is represented by a finite collection of propositional atoms.
