definition: >-
  For a set-sized signature $\Sigma$ let $\kappa=\max(\aleph_0,|\Sigma|)$. At one
  object the individual domain is a singleton. Arrows are pairs $(s,w)$ comprising
  a finite multiset on a set of size $\kappa^+$ and a finite word on an alphabet of
  size $\kappa$. Composition adds multisets and concatenates words. At a relational
  type a profile assigns to each arrow a row on argument tuples. Among arrows with
  equal total multiset size and equal word, its row depends only on the multiplicities
  on a single set of at most $\kappa$ coordinates. Transport is precomposition.
  Use the word assignments in the write-up for the constants.
arguments:
- id: necessary-strong-atoms
  holds: [necessary-strong-atomicity-r]
  choice: free
  writeup: finite-multisets-free-words
  text: >-
    The finite support of $s$ singles out the arrow $(s,w)$ among arrows of the
    same multiset size and word. Restrict a nonzero entity to one such arrow and
    one tuple there. Its profile is admitted and is an atom. Right cancellation
    makes its transport at every arrow either bottom or another single-arrow,
    single-tuple atom, so it is a strong atom. This holds necessarily at all
    relational types.
- id: barcan
  holds: [necessary-barcan-r]
  choice: free
  writeup: finite-multisets-free-words
  text: >-
    Every entity lifts along every arrow $(h,w)$. For a relation, prescribe the
    target rows on the right multiples of that arrow, stripping off $h$ and the
    suffix $w$, and use empty rows elsewhere. A pin for the lift consists of a
    pin for the target together with the finite support of $h$. The individual
    case uses the singleton domain. This yields necessary Barcan at all types.
- id: logical-necessity
  holds: [logical-necessity-r]
  choice: uses
  writeup: finite-multisets-free-words
  text: >-
    Give each realizable sentence in the signature its own letter and choose a
    realizing assignment at the sole object. On words ending in that letter glue
    the assigned relational profiles after stripping off the letter. Each constant
    uses at most $\kappa$ pins, and the individual assignment is unique. Transport
    along the one-letter arrow with zero multiset realizes the chosen assignment
    simultaneously. This yields Logical Necessity at the designated identity.
- id: no-propositional-join
  fails: [boolean-completeness-t, necessary-boolean-completeness-t]
  choice: free
  writeup: finite-multisets-free-words
  text: >-
    Partition the index set into two pieces of size $\kappa^+$. Take as a current
    family the singleton propositions selecting the one-element multiset and
    empty word at each index of the first piece. A join would contain all those
    arrows and omit all analogous arrows in the other piece, since each omitted
    singleton's complement is an upper bound. Its pin of size at most $\kappa$
    misses indices in both pieces, where the row would have to agree.
- id: countable-joins
  holds: [necessary-countable-boolean-completeness-r]
  choice: uses
  writeup: finite-multisets-free-words
  text: >-
    The external set of standard numeral values at any base type is an admitted
    current inductive row. All current internal numbers therefore belong to this
    at most countable set. A countable family's nonempty, pairwise disjoint
    numerical fibers then show that it is externally at most countable. Its
    rowwise union is admitted by taking the union of a countable choice of pins,
    and it is the least upper bound. The argument holds at the sole object.
- id: truths-are-nd-necessary
  holds: [necessary-truths-are-nd-necessary]
  choice: free
  writeup: finite-multisets-free-words
  text: >-
    Let $q$ be true only at the identity. At every proper arrow its transport is bottom,
    so for every currently true $p$ the identity witnesses $q$ and every arrow
    satisfies $\Diamond q\to p$. Thus $p$ is ND-necessary. The universally quantified
    pure sentence holds throughout the model.
