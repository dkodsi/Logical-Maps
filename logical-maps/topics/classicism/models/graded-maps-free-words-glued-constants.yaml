  lean: none
sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, graded-map construction and separation, 26 November 2026.
- The supported product and free-word gluing in symmetric-surjection-products, adapted to graded maps.
source_names:
- Codex via Kodsi, 26 Nov
