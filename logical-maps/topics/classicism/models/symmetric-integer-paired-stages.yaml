  lean: none
sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, symmetric integer-stage construction, 26 November 2026.
- The stages, word gluing and doublet return arguments of integer-stages-paired-individuals-glued-constants, adapting the two-object model of Cian Dorr and Claude Fable 5.1.
