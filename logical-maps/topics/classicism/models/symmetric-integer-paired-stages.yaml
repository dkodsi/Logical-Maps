references:
- paper: bounds-of-possibility
  role: background
  locator: Appendix D, pp. 400–409
  note: Two-hat necessity, 5-necessity and the Barcan formula for 5-necessity.
definition: >-
  At integer stage $n$ the individuals have coordinates $i\in\mathbb Z$, each
  with $\aleph_1$ doublets and also a singleton if $i\le n$. Arrows are all
  coordinate-preserving maps sending each block into a block, with a free-word
  label. At a relational type require a common countable pin of source
  individuals for all profile rows at fixed target and word. In addition,
  postcomposing a map with a coordinate-preserving block automorphism must
  transport its row by that automorphism. Transport is precomposition.
  Evaluate at stage zero. For Logical Necessity use one proposition name or
  the purely relational signature interpretation in the write-up.
arguments:
- id: boolean-joins
  holds: [necessary-boolean-completeness-r]
  choice: uses
  writeup: symmetric-integer-paired-stages
  text: >-
    Pin a current family by a countable block-closed set $N$ containing all
    source singletons. At each target, word and map take the union of the
    members' rows over maps agreeing there on $N$. The union is pinned and
    equivariant. For any upper bound, move the additional pin doublets of a
    chosen member off the upper bound's pin by an automorphism fixing $N$,
    then amalgamate the two prescribed restrictions on whole blocks. The
    moved member remains in the family and the upper bound contains the
    original contribution. The constructed union is least at each type.
- id: barcan
  holds: [necessary-barcan-r]
  choice: uses
  writeup: symmetric-integer-paired-stages
  text: >-
    On the pin of a property a possible witnessing map agrees with a
    block-respecting split epimorphism. For every target block reserve a
    fresh source doublet to supply its section. Transport along the section
    lifts any typed entity, and stripping a word suffix lifts the remaining
    word coordinate. This yields Barcan at every stage and all types.
- id: modal-separations
  fails: [five-implies-two-hat-necessity, necessary-five-implies-two-hat-necessity, two-hat-implies-nd-necessity, necessary-two-hat-implies-nd-necessity]
  choice: free
  writeup: symmetric-integer-paired-stages
  text: >-
    The coordinate inclusion and its approximate returns defeat two-hat
    necessity of the proposition that coordinate one lacks a singleton. For
    5-necessity, use the equivariant property of admitting a pin omitting
    that singleton. Each current proposition passes its test two-hat
    necessarily: require a possible return injective on the original pin
    and its partners. The Barcan formula for 5-necessity gives the result.
    For the reverse separation use the coordinate-zero singleton and test
    distinctness of the images of its replacement doublet. Translation
    repeats both separations at every stage.
- id: atomlessness
  holds: [necessary-atomlessness]
  choice: free
  writeup: symmetric-integer-paired-stages
  text: >-
    Keep a witnessing arrow fixed on the pin of a nonzero proposition.
    At a fresh ordinary doublet one may send the two inputs to distinct
    or coinciding values. Testing their distinctness is equivariant and
    splits the original proposition into two nonempty parts at every stage.
- id: logical-necessity
  holds: [logical-necessity-r]
  choice: uses
  writeup: symmetric-integer-paired-stages
  text: >-
    Translating stages and coordinate labels preserves the symmetry and all
    pure sentences. Assign the constants a realizing tuple for each possible
    pure matrix on its designated final letter. Equivariance is preserved
    separately on each last-letter sector. Sharing the tuples across choices
    of names keeps the pin of each constant countable.
- id: inextensible-comprehension
  holds: [necessary-inextensible-comprehension-r]
  choice: uses
  writeup: symmetric-integer-paired-stages
  text: >-
    Enlarge the pin of a current row to a union of blocks containing all
    source singletons. Use empty nonempty-word rows; otherwise take images
    of current members under maps agreeing on that pin and embedding a
    countable block support of the member. At the identity each such partial
    embedding extends to a block automorphism fixing the pin, giving the
    original row. To test inextensibility after any arrow, factor a witnessing
    map through fresh intermediate doublets outside the later tester's pin.
    The second map can then keep its tester row and still send the intermediate
    member to the prescribed future tuple.
- id: tame-rigidity
  holds: [necessary-tame-rigidity-r]
  choice: uses
  writeup: symmetric-integer-paired-stages
  text: >-
    A weakly rigid relation with block-closed pin $P$ containing all the
    source singletons equals the union of the typed images of its current
    members over maps agreeing on $P$: persistence gives inclusion in the
    relation, and weak inextensibility gives the reverse. Postcomposition
    proves persistence after each arrow. For future weak inextensibility
    factor an individual witnessing map through fresh intermediate doublets
    while keeping the tester's pin fixed. Thus every transport is weakly rigid.
- id: both-rigid-powers
  holds: [necessary-rigid-power-r, necessary-weakly-rigid-power-r]
  choice: uses
  writeup: symmetric-integer-paired-stages
  text: >-
    Replace a witnessing arrow, on the pins of the bound and tester, by a split
    epimorphism $j$ that is a block isomorphism off countable exception sets.
    A future rigid subrelation with current row $D$ lifts to the rigid relation
    formed by saturating $\{a\in F_{\rm current}:ja\in D\}$ under maps
    agreeing on the source exception set. Closure under endomaps fixing that
    set follows by factoring them across $j$ to endomaps fixing the target
    subrelation's pin. The lift lies below $F$ and its image under $j$ has
    exactly row $D$. Rigid coextension makes it the desired subrelation as an
    entity, so it passes every power tester. Tame Rigidity identifies the
    two candidate power properties at each stage.
- id: represented-powers-of-the-reals
  holds: [second-order-analytic-necessitism]
  choice: free
  writeup: symmetric-integer-paired-stages
  text: >-
    At each relational type the profiles testing membership of the target stage in a subset of the integers give continuum-many labels preserved distinctly by every transport. Arbitrary sets of labelled tuples and all their powers have equivariant target-only rows with empty pin, giving a rigid real number structure and its represented powers. At individual type a countable pin for any proposed structure, enlarged by partners and all singletons, contains every individual fixed by its pointwise block stabilizer. It contains the standard successor iterates, whose set is an admitted inductive property, so these are all the numbers. The stabilizer fixes every real by extensionality. Fullness would put a different individual in the countable pin for every subset of the numbers, since every such subset is an admitted current row.
