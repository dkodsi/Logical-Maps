proof: Choose a rigid cover of the strong worlds together with bottom. Including bottom makes every cut
  by entailment rigid, even when an entity later collapses to bottom. The cuts necessarily represent every
  relation by their joins. This yields necessary Strong Leibniz and, using the derived rigid power of
  the cover, necessary relational BF. Haecceity coding then supplies necessary Rigid Comprehension at
  every finite tuple, including tuples with individual arguments; the necessitated C theorem RC⇒BC gives
  necessary BC. See the two integration write-ups for the full proofs.
notes: 'Both premises are unboxed. The BF conclusion is restricted to relational types: BF_e is not claimed.
  Finite and mixed argument tuples, including the empty tuple, are included for comprehension. No future
  comprehension premise is assumed.'
