notes: 'UNRESOLVED QUESTION ABOUT INCONSISTENCY, not a supported prediction: does C plus the original
  finitary pure Strong Possibility schema derive False? Pure SP licenses ◇_≠P only for closed pure P with
  Max(C)+P consistent. Its consistency and inconsistency remain unresolved in the inspected evidence.
  The positive conclusion field false records the question in the existing conjecture format; it is not
  proved evidence. No infinitary extension, unnamed model construction, or new consistency assumption
  is asserted. The checked finite-disjunction criterion retains its Con(Max) hypothesis and does not prove
  that criterion holds. The source candidate Con(Max+U_G+D(¬G#)) remains open; separate consistency of
  the added sentences is not joint consistency. A model of that candidate would address one obstruction
  only, whereas a suitable failed finite universal conjunction would refute SP. Modal-value witness preservation
  and a genuine many-sorted Henkin truth interpretation remain substantive obligations. See the matching
  write-up and conjecture handoff for exact definitions and what would settle the question.'
